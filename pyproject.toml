[project]
name = "f1-radio-transcription"
version = "0.1.0"
description = "Live F1 team radio transcripts on your phone, with race context, from MultiViewer or faster-whisper."
license = "MIT"
authors = [{ name = "Rushi Vishavadia" }]
keywords = ["formula1", "f1", "team-radio", "transcription", "multiviewer", "whisper"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "qrcode>=8.2",
    "websockets>=17.2",
]

[project.optional-dependencies]
whisper = [
    "av<16",
    "faster-whisper==1.2.1",
]

[project.scripts]
race = "f1radio.race:main"
replay = "f1radio.replay:main"
server = "f1radio.server:main"
mv-radio = "f1radio.mv_radio:main"
transcribe-radio = "f1radio.transcribe_radio:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "f1radio"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
